name: Data CI
on:
  workflow_dispatch: {}

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run data tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/test_data_pipeline.py -q
