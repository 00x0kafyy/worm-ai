name: Train CI
on:
  workflow_dispatch: {}

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run training stub
        run: python src/training/train.py
      - name: Check metric gate
        run: |
          python - <<'PY'
import json
with open('train_metrics.json') as f:
    m=json.load(f)
print('Metrics:', m)
if m.get('val_accuracy',0) < 0.75:
    raise SystemExit('Validation accuracy below gate')
PY
